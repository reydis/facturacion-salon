<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturación · Extensiones de Pelo</title>
<meta name="theme-color" content="#0e0d0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f3; --card:#ffffff; --ink:#2a1d22; --muted:#7d6b72; --line:#ecdfe3;
  --acc:#8a2d55; --acc-2:#b24a78; --acc-soft:#f6e6ee;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#a0640b; --warn-soft:#fbf0dc; --bad:#a3283a; --bad-soft:#fbe5e8;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
header.top h1{font-size:22px;color:var(--acc)}
header.top .sub{font-size:12.5px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:860px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc-2);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.i{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:active{background:#6f2344}
.btn.g{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.btn.d{color:var(--bad);border-color:var(--bad-soft)}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.Pagada{background:var(--ok-soft);color:var(--ok)}
.pill.Pendiente{background:var(--bad-soft);color:var(--bad)}
.pill.Abonada{background:var(--warn-soft);color:var(--warn)}
.pill.Anulada{background:#eee;color:#777;text-decoration:line-through}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--acc-soft);color:var(--acc);font-weight:700}
.line-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.line-item .g{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:end;margin-top:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px}
.totals{background:var(--acc-soft);border-radius:12px;padding:12px;margin-top:10px}
.totals .r{display:flex;justify-content:space-between;padding:3px 0}
.totals .r.big{font-weight:700;font-size:18px;border-top:1px dashed #d9b8c7;margin-top:6px;padding-top:8px;color:var(--acc)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--acc)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.banner{font-size:13px;padding:9px 12px;border-radius:10px;margin-bottom:12px}
.banner.w{background:var(--warn-soft);color:var(--warn)}
.banner.b{background:var(--bad-soft);color:var(--bad)}
/* receipt */
.receipt{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;max-width:520px;margin:0 auto 12px;position:relative;overflow:hidden}
.receipt .bh{text-align:center;border-bottom:2px solid var(--acc);padding-bottom:12px;margin-bottom:12px}
.receipt .bh h2{color:var(--acc);font-size:22px}
.receipt .meta{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:12px}
.receipt table{width:100%;border-collapse:collapse;font-size:14px}
.receipt th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 0}
.receipt td{padding:7px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.receipt .tr{text-align:right;padding-left:10px}
.receipt .sum{margin-top:10px;font-size:14px}
.receipt .sum .r{display:flex;justify-content:space-between;padding:2px 0}
.receipt .sum .r.big{font-size:18px;font-weight:700;color:var(--acc);border-top:2px solid var(--acc);margin-top:6px;padding-top:7px}
.receipt .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;white-space:pre-wrap}
.stamp{position:absolute;top:16px;right:-40px;transform:rotate(30deg);padding:4px 40px;font-weight:800;font-size:13px;letter-spacing:.1em;color:#fff}
.stamp.Pagada{background:var(--ok)} .stamp.Pendiente{background:var(--bad)} .stamp.Abonada{background:var(--warn)} .stamp.Anulada{background:#888}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;margin:0 auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(42,29,34,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:640px){.md{border-radius:18px}}
.md h3{font-size:19px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.sec-t h2{font-size:19px}
.search{margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.fgrid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);cursor:pointer;border:0;padding:0}
.fgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fgrid .ph b{position:absolute;left:4px;bottom:4px;background:rgba(42,29,34,.75);color:#fff;font-size:10px;padding:2px 6px;border-radius:99px;font-weight:600}
.fgrp{margin-top:10px}
.fgrp .h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.viewer img{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:#111;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.cmp div{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.newph{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.newph img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b i{display:block;width:100%;background:var(--acc-2);border-radius:4px 4px 0 0;min-height:2px}
.bars .b span{font-size:9.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.hbar{height:8px;background:var(--acc-soft);border-radius:99px;overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--acc)}
.pay{border:1px dashed #d9b8c7;border-radius:12px;padding:12px;margin-top:14px;background:#fffafc}
.pay h4{margin:0 0 8px;font-family:Fraunces,Georgia,serif;color:var(--acc);font-size:16px}
.pay .m{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.pay .m:first-of-type{border-top:0}
.pay img,.pay svg{display:block;margin:8px auto 0;width:160px;height:160px;image-rendering:pixelated}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.subsec{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
@media print{body{background:#fff}header.top,nav.tabs,#banner,.actions,.noprint,#toast{display:none!important}.wrap{padding:0}.receipt{border:0;max-width:none}}
.ask{background:linear-gradient(135deg,var(--acc),var(--acc-2));border-radius:var(--r);padding:14px;margin-bottom:12px;color:#fff}
.ask h3{font-size:17px;margin-bottom:8px}
.ask .row input{border:0}
.ask input,.ask .btn{color:var(--ink)}
.ans{background:#fff;color:var(--ink);border-radius:12px;padding:12px;margin-top:10px}
.ans .h{font-weight:700;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:17px;font-weight:700;cursor:pointer;color:var(--acc)}
.qty .n{min-width:42px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.low{color:var(--bad)} .lowbg{background:var(--bad-soft)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

/* ================= LUJO · negro y dorado ================= */
:root{
  --bg:#0e0d0c; --card:#171513; --card2:#1d1a17; --ink:#f3ece2; --muted:#a39a8e; --line:#2b2723;
  --acc:#c9a961; --acc-2:#e3cc8f; --acc-soft:rgba(201,169,97,.13); --gold-grad:linear-gradient(135deg,#e9d39b 0%,#c9a961 45%,#a8843f 100%);
  --ok:#8cc5a0; --ok-soft:rgba(140,197,160,.13); --warn:#e6c07a; --warn-soft:rgba(230,192,122,.13); --bad:#ec9a9a; --bad-soft:rgba(236,154,154,.13);
  --r:16px; --serif:"Cormorant Garamond",Georgia,serif;
}
html,body{background:var(--bg);color:var(--ink);font:15px/1.5 Jost,system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(201,169,97,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
.sec-t h2{font-size:26px} .card h3{font-size:20px!important}
.wrap{max-width:1100px}
header.top{padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:46px;height:46px;border-radius:50%;border:1px solid var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.08em;color:var(--acc);background:radial-gradient(circle at 30% 25%,rgba(233,211,155,.18),transparent 70%);flex:none}
header.top h1{font-size:26px;color:var(--ink);text-transform:uppercase;letter-spacing:.14em;font-weight:600;line-height:1.1}
header.top .sub{font-size:10.5px;color:var(--acc);text-transform:uppercase;letter-spacing:.32em;margin-top:3px}
@media(max-width:520px){header.top h1{font-size:15px;letter-spacing:.08em}header.top .sub{font-size:8.5px;letter-spacing:.2em}.mono{width:38px;height:38px;font-size:13px}.brand{gap:9px}header.top .lbl{display:none}header.top .btn.p{width:40px;height:40px;padding:0;font-size:20px}.receipt{padding:26px 18px 22px}.receipt .bh h2{font-size:19px;letter-spacing:.12em}.receipt th{letter-spacing:.06em;font-size:9px}}
.card,.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.kpi{position:relative;overflow:hidden;padding:16px}
.kpi:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--gold-grad);opacity:.85}
.kpi .l{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:0}
input.i,select.i,textarea.i{background:#11100e;border-color:var(--line);color:var(--ink)}
input.i::placeholder,textarea.i::placeholder{color:#6f675e}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=date].i{color-scheme:dark}
label.f{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px}
.btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;font-weight:500;letter-spacing:.06em;padding:9px 18px}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--gold-grad);border:0;color:#1a1408;font-weight:600;box-shadow:0 6px 18px rgba(201,169,97,.25)}
.btn.p:active{filter:brightness(.92);background:var(--gold-grad)}
.btn.g{background:var(--acc-soft);border:1px solid rgba(201,169,97,.35);color:var(--acc-2)}
.btn.d{color:var(--bad);border-color:rgba(236,154,154,.35)}
.btn.wa{background:#1f7a48;border-color:#1f7a48;color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--acc);border-radius:50%;width:40px;height:40px}
.list .it{border-bottom-color:var(--line)}
.list .it .t{font-weight:500;letter-spacing:.02em}
.pill{letter-spacing:.06em;font-weight:600;border:1px solid transparent}
.pill.Pagada{background:var(--ok-soft);color:var(--ok);border-color:rgba(140,197,160,.3)}
.pill.Pendiente{background:var(--bad-soft);color:var(--bad);border-color:rgba(236,154,154,.3)}
.pill.Abonada{background:var(--warn-soft);color:var(--warn);border-color:rgba(230,192,122,.3)}
.pill.Anulada{background:#222;color:#888}
.seg,.chips button{background:var(--card);border-color:var(--line)}
.seg button.on{background:var(--acc-soft);color:var(--acc-2)}
.chips button{color:var(--muted);letter-spacing:.04em}
.chips button.on{background:var(--gold-grad);border-color:transparent;color:#1a1408;font-weight:600}
.line-item{background:#131210;border-color:var(--line)}
.totals{background:var(--acc-soft);border:1px solid rgba(201,169,97,.25)}
.totals .r.big{border-top-color:rgba(201,169,97,.4);color:var(--acc-2);font-family:var(--serif);font-size:24px}
.switch input{accent-color:var(--acc)}
.banner.w{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(230,192,122,.25)}
.banner.b{background:var(--bad-soft);color:var(--bad)}
.lowbg{background:rgba(236,154,154,.08)!important;border:1px solid rgba(236,154,154,.25)!important}
.ask{background:linear-gradient(135deg,#2a2214,#16120b);border:1px solid rgba(201,169,97,.35);color:var(--ink)}
.ask h3{color:var(--acc-2)}
.ask input.i{background:#0e0d0c;color:var(--ink)} .ask .btn{color:var(--ink)}
.ans{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.qty button{background:transparent;border-color:var(--line);color:var(--acc)}
.bars .b i{background:var(--gold-grad)}
.hbar{background:#24201c} .hbar i{background:var(--gold-grad)}
.ov{background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.md{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.toast{background:var(--gold-grad);color:#1a1408;font-weight:600}
.x{color:var(--muted)}
.empty{color:var(--muted)}
.fgrid .ph{background:#222}
nav.tabs{background:rgba(14,13,12,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav.tabs button{color:#8a8178;letter-spacing:.06em;font-size:10.5px;text-transform:uppercase}
nav.tabs button.on{color:var(--acc)}
@media(min-width:1000px){
  nav.tabs{top:0;bottom:0;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding:28px 12px}
  nav.tabs .in{flex-direction:column;gap:4px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:12px}
  nav.tabs button.on{background:var(--acc-soft)}
  .wrap{margin-left:auto;margin-right:auto;padding:28px 40px 60px 250px;max-width:1340px}
  .toast{bottom:30px}
}
/* factura: papelería marfil */
.receipt{--bg:#f3ede2;--ink:#1c1712;--muted:#857a6c;--line:#e4dacb;--acc:#a8843f;--acc-2:#8e6d2f;--acc-soft:#f2e8d3;--ok:#2f7a4f;--bad:#a8323e;--warn:#9a6a12;
  background:#fbf8f2;color:var(--ink);border:1px solid #e9dfcd;border-radius:6px;padding:34px 30px 28px;max-width:600px;
  box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 6px #fbf8f2,inset 0 0 0 7px #d9c49a}
.receipt .bh{border-bottom:0;padding-bottom:6px;margin-bottom:18px}
.receipt .bh:after{content:"";display:block;height:3px;margin-top:16px;border-top:1px solid #c9a961;border-bottom:1px solid #c9a961}
.receipt .mono-r{width:58px;height:58px;margin:0 auto 10px;border-radius:50%;border:1px solid #c9a961;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.08em;color:#a8843f}
.receipt .bh h2{color:#1c1712;font-size:26px;text-transform:uppercase;letter-spacing:.16em}
.receipt .doc{font-size:10.5px;letter-spacing:.34em;color:#a8843f;text-transform:uppercase;margin:6px 0 4px}
.receipt th{color:#a8843f;letter-spacing:.14em;font-size:10px;border-bottom:1px solid #c9a961}
.receipt td{border-bottom:1px dotted #ddd2bf}
.receipt .sum .r.big{color:#1c1712;border-top:1px solid #c9a961;font-family:var(--serif);font-size:24px}
.receipt .foot{font-family:var(--serif);font-style:italic;font-size:14px;color:#6d6357;border-top:1px solid #e4dacb;padding-top:12px}
.receipt .pay{background:#f6f0e3;border-color:#d9c49a}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

}

const TABS = [['inicio','Inicio'],['nueva','Nueva'],['facturas','Facturas'],['almacen','Almacén'],['clientes','Clientas'],['reportes','Reportes']];

/* ============ render ============ */
function render(){
  $('#hdrName').textContent = S.negocio.nombre || 'Mi Salón';
  $('#hdrMono').textContent = iniciales();
  const ciu = (S.negocio.direccion||'').split(',').slice(1).map(x => x.trim().replace(/\s*\d{5}$/,'')).filter(Boolean);
  $('#hdrSub').textContent = ciu.length ? ciu.join(' · ').replace(/\bNJ\b/,'New Jersey') : 'Facturación · Billing';
  $('#gearBtn').innerHTML = ICON.ajustes;
  $('#tabs').innerHTML = TABS.map(([k,l]) => '<button class="'+((S.view===k || (k==='facturas'&&S.view==='ver') || (k==='reportes'&&false))?'on':'')+'" data-act="go" data-v="'+k+'">'+ICON[k]+l+'</button>').join('');
  let b = '';
  if (S.mode === 'local' && necesitaRespaldo()) b = '<div class="banner w">Tus datos viven solo en este teléfono. <b><a href="#" data-act="go" data-v="ajustes" style="color:inherit">Haz una copia de seguridad</a></b> para no perderlos.</div>';
  else if (S.slow) b = '<div class="banner w">No se pudo conectar todavía; lo que ves puede estar desactualizado.</div>';
  if (S.readOnly) b += '<div class="banner b">Solo lectura: no tienes permiso para guardar cambios.</div>';
  $('#banner').innerHTML = b;
  const v = { reportes: vReportes, inicio: vInicio, almacen: vAlmacen, nueva: vNueva, facturas: vFacturas, ver: vVer, clientes: vClientes, servicios: vServicios, ajustes: vAjustes }[S.view] || vInicio;
  $('#app').innerHTML = v();
}

function filaFactura(f){
  const c = calc(f);
  return '<div class="it" data-act="ver" data-id="'+f.id+'"><div class="grow"><div class="t">'+esc(f.clienteNombre||'Sin cliente')+'</div><div class="small muted">'+numFmt(f)+' · '+fFecha(f.fecha)+'</div></div><div style="text-align:right"><div class="num" style="font-weight:700">'+money(c.total)+'</div>'+
    (c.estado==='Abonada' ? '<div class="small muted num">Debe '+money(c.balance)+'</div>' : '')+'</div><span class="pill '+c.estado+'">'+c.estado+'</span></div>';
}
const ordenFact = arr => arr.slice().sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.numero||0) - (a.numero||0));

function vInicio(){
  const mes = mesActual(); const activas = S.facturas.filter(f => !f.anulada);
  let facturado = 0, cobrado = 0, pendiente = 0, nMes = 0;
  activas.forEach(f => { const c = calc(f);
    if ((f.fecha||'').startsWith(mes)) { facturado += c.total; nMes++; }
    (f.pagos||[]).forEach(p => { if ((p.fecha||'').startsWith(mes)) cobrado += num(p.monto); });
    pendiente += c.balance; });
  const deben = activas.filter(f => calc(f).balance > 0);
  const ult = ordenFact(S.facturas).slice(0,6);
  const mesNom = new Date().toLocaleDateString('es-DO',{month:'long'});
  return '<div class="kpis">'+
    '<div class="kpi"><div class="l">Cobrado en '+mesNom+'</div><div class="v" style="color:var(--ok)">'+money(cobrado)+'</div></div>'+
    '<div class="kpi"><div class="l">Facturado en '+mesNom+'</div><div class="v">'+money(facturado)+'</div></div>'+
    '<div class="kpi"><div class="l">Por cobrar</div><div class="v" style="color:var(--bad)">'+money(pendiente)+'</div></div>'+
    '<div class="kpi"><div class="l">Facturas del mes</div><div class="v">'+nMes+'</div></div></div>'+
    (todasAlertas().length ? '<div class="card"><div class="sec-t"><h2>Para hoy</h2><button class="btn sm g" data-act="clihoy">Ver todas ('+todasAlertas().length+')</button></div>'+
      todasAlertas().slice(0,6).map(({c, a}) => '<div class="it row" style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer" data-act="msg" data-id="'+c.id+'" data-v="'+a.tipo+'"><div class="grow"><div style="font-weight:600">'+esc(c.nombre)+'</div><div class="small muted">'+esc(a.txt)+'</div></div><span class="btn sm wa">Escribir</span></div>').join('')+'</div>' : '')+
    (bajos().length ? '<div class="card lowbg" style="border-color:transparent"><div class="sec-t"><h2 class="low">Se está acabando</h2><button class="btn sm" data-act="go" data-v="almacen">Ver almacén</button></div>'+bajos().slice(0,6).map(p => '<div class="row between small" style="padding:4px 0"><span>'+esc(invNombre(p))+'</span><b class="num low">'+(num(p.cantidad)<=0?'Agotado':(num(p.cantidad)===1?'Queda ':'Quedan ')+fmtQ(p.cantidad)+' '+plural(p.unidad,p.cantidad))+'</b></div>').join('')+'</div>' : '')+
    (deben.length ? '<div class="card"><div class="sec-t"><h2>Clientas que deben</h2><span class="small muted">'+deben.length+'</span></div><div class="list">'+ordenFact(deben).slice(0,8).map(filaFactura).join('')+'</div></div>' : '')+
    '<div class="card"><div class="sec-t"><h2>Últimas facturas</h2><button class="btn sm g" data-act="go" data-v="facturas">Ver todas</button></div>'+
    (ult.length ? '<div class="list">'+ult.map(filaFactura).join('')+'</div>' :
      '<div class="empty">Todavía no hay facturas.<br><br>'+(S.servicios.length?'':'<span style="font-family:var(--serif);font-size:22px;color:var(--acc-2);font-style:italic">Bienvenida a tu salón</span><br><br><b>1.</b> Toca <b>⚙</b> → <b>Servicios y precios</b> y pon tus precios.<br><b>2.</b> En <b>Almacén</b> registra tu pelo y productos.<br><b>3.</b> Crea tu primera factura.<br><br>')+'<button class="btn p" data-act="go" data-v="nueva">+ Crear factura</button></div>')+'</div>';
}

    '<option value="__libre">+ Línea libre (escribir)</option>';

  (d.clienteId==='__nuevo' ? '<div class="row"><div class="grow"><label class="f">Nombre</label><input class="i" data-f="nNombre" value="'+esc(d.nNombre)+'" placeholder="Nombre de la clienta"></div><div class="grow"><label class="f">Teléfono / WhatsApp</label><input class="i" type="tel" data-f="nTel" value="'+esc(d.nTel)+'" placeholder="(201) 000-0000"></div></div>' : '')+
  '</div>'+
  '<div class="card"><div class="sec-t" style="margin-top:0"><h3 style="font-size:16px">Servicios y productos</h3></div><div id="items">'+itemsHtml()+'</div>'+
  '<select class="i" data-f="addser">'+serOpts+'</select>'+
  (S.servicios.length ? '' : '<div class="small muted" style="margin-top:6px">Tip: guarda tus servicios con precio en la pestaña <b>Servicios</b> para facturar más rápido.</div>')+
  '</div>'+
  '<div class="card"><div class="row"><div class="grow"><label class="f" style="margin-top:0">Descuento ($)</label><input class="i" inputmode="decimal" data-f="descuento" value="'+(d.descuento||'')+'" placeholder="0"></div>'+
  '<div class="grow" style="padding-top:18px"><label class="switch"><input type="checkbox" data-f="itbis"'+(d.itbis?' checked':'')+'> Sales tax ('+num(S.negocio.tasa)+'%) solo a productos</label></div></div>'+

  '<div class="grow"><label class="f">Método</label><select class="i" data-f="metodo">'+METODOS.map(m=>'<option'+(d.metodo===m?' selected':'')+'>'+m+'</option>').join('')+'</select></div></div>'+
  '<div class="row" style="margin-top:8px"><button class="btn sm g" data-act="pagototal">Pagó completo</button><button class="btn sm g" data-act="pagomitad">Abonó 50%</button></div>'+
  '<label class="f">Nota (opcional)</label><textarea class="i" data-f="nota" placeholder="Ej: 20 pulgadas, color 1B, 3 paquetes. Próximo mantenimiento en 6 semanas.">'+esc(d.nota)+'</textarea>'+
  '<label class="f">Próximo mantenimiento (opcional)</label><div class="row" style="flex-wrap:wrap;gap:6px"><input class="i" type="date" id="d_prox" data-f="proxima" value="'+esc(d.proxima||'')+'" style="width:165px">'+[4,6,8].map(n => '<button class="btn sm g" data-act="proxsem" data-v="'+n+'" data-t="d_prox">'+n+' sem.</button>').join('')+'</div>'+
  '<div id="tot">'+totHtml()+'</div></div>'+

function itemsHtml(){
  const d = S.draft;
  if (!d.items.length) return '<div class="small muted" style="margin-bottom:10px">Agrega al menos un servicio.</div>';
  return d.items.map((it,i) => '<div class="line-item">'+(it.invId?'<div class="small muted" style="margin-bottom:4px">📦 Del almacén · se descuenta al guardar</div>':'')+'<div class="row"><input class="i grow" data-f="item" data-i="'+i+'" data-k="desc" value="'+esc(it.desc)+'" placeholder="Descripción"><button class="x" data-act="quitar" data-i="'+i+'" aria-label="Quitar">×</button></div>'+
    '<div class="g"><div><label class="f" style="margin-top:0">Cant.</label><input class="i" inputmode="decimal" data-f="item" data-i="'+i+'" data-k="cant" value="'+esc(it.cant)+'"></div>'+
    '<div><label class="f" style="margin-top:0">Precio ($)</label><input class="i" inputmode="decimal" data-f="item" data-i="'+i+'" data-k="precio" value="'+esc(it.precio)+'"></div>'+
    '<div class="num" style="padding-bottom:10px;font-weight:600" id="lt'+i+'">'+money(num(it.cant)*num(it.precio))+'</div></div></div>').join('');
}
function totHtml(){
  const d = S.draft; const c = calc({...d, pagos: num(d.abono) ? [{monto:num(d.abono)}] : []});
  return '<div class="totals"><div class="r"><span>Subtotal</span><span class="num">'+money(c.subtotal)+'</span></div>'+
    (c.desc ? '<div class="r"><span>Descuento</span><span class="num">−'+money(c.desc)+'</span></div>' : '')+
    (d.itbis && c.itbis ? '<div class="r"><span>Sales tax '+c.tasa+'% (productos)</span><span class="num">'+money(c.itbis)+'</span></div>' : '')+
    '<div class="r big"><span>Total</span><span class="num">'+money(c.total)+'</span></div>'+
    (c.pagado ? '<div class="r"><span>Pagado ahora</span><span class="num">'+money(c.pagado)+'</span></div><div class="r" style="font-weight:700"><span>Queda debiendo</span><span class="num">'+money(c.balance)+'</span></div>' : '')+'</div>';
}
function proximoNumero(){
  const max = S.facturas.reduce((a,f) => Math.max(a, num(f.numero)), 0);
  return Math.max(num(S.negocio.siguiente) || 1, max + 1);
}

function vFacturas(){
  const q = S.q.trim().toLowerCase();
  let arr = ordenFact(S.facturas).filter(f => {
    const c = calc(f);
    if (S.filtro === 'pendientes' && !(c.balance > 0 && !f.anulada)) return false;
    if (S.filtro === 'pagadas' && c.estado !== 'Pagada') return false;
    if (S.filtro === 'anuladas' && !f.anulada) return false;
    if (q && !((f.clienteNombre||'').toLowerCase().includes(q) || numFmt(f).toLowerCase().includes(q) || (f.clienteTel||'').includes(q))) return false;
    return true;
  });
  const tot = arr.filter(f=>!f.anulada).reduce((a,f)=>a+calc(f).total,0);
  return '<div class="sec-t"><h2>Facturas</h2><span class="small muted">'+arr.length+' · '+money(tot)+'</span></div>'+
    '<input class="i search" data-f="q" value="'+esc(S.q)+'" placeholder="Buscar por clienta, número o teléfono">'+
    '<div class="seg" style="margin-bottom:12px">'+[['todas','Todas'],['pendientes','Deben'],['pagadas','Pagadas'],['anuladas','Anuladas']].map(([k,l])=>'<button class="'+(S.filtro===k?'on':'')+'" data-act="filtro" data-v="'+k+'">'+l+'</button>').join('')+'</div>'+
    '<div class="card">'+(arr.length ? '<div class="list">'+arr.map(filaFactura).join('')+'</div>' : '<div class="empty">No hay facturas aquí.</div>')+'</div>';
}

function vVer(){
  const f = S.facturas.find(x => x.id === S.facturaId);
  if (!f) return '<div class="empty">Factura no encontrada.<br><br><button class="btn" data-act="go" data-v="facturas">Volver</button></div>';
  const c = calc(f); const n = S.negocio;
  return '<div class="row between noprint" style="margin-bottom:10px"><button class="btn sm" data-act="go" data-v="facturas">← Facturas</button><span class="pill '+c.estado+'">'+c.estado+'</span></div>'+
  '<div class="receipt"><div class="stamp '+c.estado+'">'+c.estado.toUpperCase()+'</div>'+
  '<div class="bh"><div class="mono-r">'+iniciales()+'</div><h2>'+esc(n.nombre)+'</h2>'+
   (n.direccion?'<div class="small muted">'+esc(n.direccion)+'</div>':'')+
   '<div class="small muted">'+[n.telefono?'Tel. '+esc(n.telefono):'', n.rnc?'EIN '+esc(n.rnc):''].filter(Boolean).join(' · ')+'</div></div>'+
  '<div class="doc" style="text-align:center;margin:-6px 0 16px">Factura · Invoice</div><div class="meta"><div><div class="muted small">Clienta · Client</div><b>'+esc(f.clienteNombre||'—')+'</b>'+(f.clienteTel?'<div class="small">'+esc(f.clienteTel)+'</div>':'')+'</div>'+
   '<div style="text-align:right"><div class="muted small">No. · Date</div><b>'+numFmt(f)+'</b><div class="small">'+fFecha(f.fecha)+'</div></div></div>'+
  '<table><thead><tr><th>Servicio · Service</th><th class="tr">Cant. · Qty</th><th class="tr">Importe · Amount</th></tr></thead><tbody>'+
   f.items.map(it => '<tr><td>'+esc(it.desc)+'<div class="small muted num">'+money(it.precio)+' c/u</div></td><td class="tr num">'+esc(it.cant)+'</td><td class="tr num">'+money(num(it.cant)*num(it.precio))+'</td></tr>').join('')+
  '</tbody></table><div class="sum">'+
   '<div class="r"><span>Subtotal</span><span class="num">'+money(c.subtotal)+'</span></div>'+
   (c.desc?'<div class="r"><span>Descuento</span><span class="num">−'+money(c.desc)+'</span></div>':'')+
   (f.itbis && c.itbis?'<div class="r"><span>Sales tax '+c.tasa+'%</span><span class="num">'+money(c.itbis)+'</span></div>':'')+
   '<div class="r big"><span>TOTAL</span><span class="num">'+money(c.total)+'</span></div>'+
   (f.pagos||[]).map(p => '<div class="r small"><span>Pago '+fFecha(p.fecha)+' · '+esc(p.metodo)+'</span><span class="num">−'+money(p.monto)+'</span></div>').join('')+
   (!f.anulada ? '<div class="r" style="font-weight:700;margin-top:4px"><span>'+(c.balance>0?'Balance pendiente · Balance due':'Balance')+'</span><span class="num" style="color:'+(c.balance>0?'var(--bad)':'var(--ok)')+'">'+money(c.balance)+'</span></div>' : '')+
  '</div>'+(f.nota?'<div class="small" style="margin-top:12px;padding:8px 10px;background:var(--bg);border-radius:8px"><b>Nota:</b> '+esc(f.nota)+'</div>':'')+
  (f.proxima && !f.anulada ? '<div class="small" style="margin-top:10px;text-align:center;padding:8px;border-radius:8px;background:var(--acc-soft);color:var(--acc)"><b>Próximo mantenimiento: '+fFecha(f.proxima)+'</b></div>' : '')+
  (!f.anulada && c.balance > 0 ? pagoHtml(c.balance) : '')+
  (n.pie?'<div class="foot">'+esc(n.pie)+'</div>':'')+'</div>'+
  (f.clienteId && cliente(f.clienteId) ? '<div class="card noprint" style="max-width:520px;margin:0 auto 12px" id="fotosFact" data-cid="'+f.clienteId+'" data-fid="'+f.id+'">'+fotosHtml(f.clienteId, f.id, true)+'</div>' : '')+
  '<div class="actions">'+
   '<a class="btn wa" href="'+waLink(f)+'" target="_blank" rel="noopener">WhatsApp</a>'+
   '<button class="btn g" data-act="copiar">Copiar texto</button>'+
   '<button class="btn" data-act="imprimir" style="grid-column:1/-1">Imprimir / Guardar PDF</button>'+
   (!f.anulada && c.balance>0 && !S.readOnly ? '<button class="btn p" data-act="abonar" style="grid-column:1/-1">+ Registrar pago / abono</button>' : '')+
   ((f.pagos||[]).length && !S.readOnly ? '<button class="btn sm" data-act="quitarpago">Quitar último pago</button>' : '')+
   (!S.readOnly ? '<button class="btn sm d" data-act="anular">'+(f.anulada?'Reactivar':'Anular')+'</button>' : '')+
  '</div><p class="small muted noprint" style="text-align:center;margin-top:12px">Para enviarla como imagen, toma una captura de pantalla de la factura.</p>';
}
function textoFactura(f){
  const c = calc(f), n = S.negocio;
  let t = '*'+n.nombre+'*\n';
  if (n.telefono) t += 'Tel. '+n.telefono+'\n';
  t += '\nFactura *'+numFmt(f)+'* · '+fFecha(f.fecha)+'\nCliente: '+(f.clienteNombre||'')+'\n\n';
  f.items.forEach(it => { t += '• '+it.desc+(num(it.cant)!==1?' x'+it.cant:'')+' — '+money(num(it.cant)*num(it.precio))+'\n'; });
  t += '\nSubtotal: '+money(c.subtotal)+'\n';
  if (c.desc) t += 'Descuento: −'+money(c.desc)+'\n';
  if (f.itbis && c.itbis) t += 'Sales tax '+c.tasa+'%: '+money(c.itbis)+'\n';
  t += '*TOTAL: '+money(c.total)+'*\n';

  if (P.cripto && P.cripto.activo && P.cripto.direccion) h += '<div class="m"><b>🪙 '+esc(P.cripto.moneda||'Cripto')+'</b>'+(P.cripto.red?' · red '+esc(P.cripto.red):'')+(usd(monto)?' · aprox. '+usd(monto).toFixed(2)+' '+esc(P.cripto.moneda||'USD'):'')+'<div class="mono" style="margin-top:4px">'+esc(P.cripto.direccion)+'</div>'+qrSvg(P.cripto.direccion)+'</div>';

async function cargarQr(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const max = 420, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    qrTmp = cv.toDataURL('image/jpeg', 0.85);
    $('#qrPrev').innerHTML = '<img src="'+qrTmp+'" style="width:90px;height:90px;border-radius:8px;border:1px solid var(--line)">';
    const ck = $('#pg_q'); if (ck) ck.checked = true;
    toast('QR cargado. Toca "Guardar datos".');

function isoD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rango(){
  const t = new Date();
  switch (S.rPer) {
    case 'hoy': return [hoy(), hoy()];
    case 'semana': { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return [isoD(d), hoy()]; }
    case 'mespasado': return [isoD(new Date(t.getFullYear(), t.getMonth()-1, 1)), isoD(new Date(t.getFullYear(), t.getMonth(), 0))];
    case 'ano': return [t.getFullYear()+'-01-01', hoy()];
    case 'custom': { const a = S.rDesde || hoy().slice(0,8)+'01', b = S.rHasta || hoy(); return a <= b ? [a,b] : [b,a]; }
    default: return [hoy().slice(0,8)+'01', hoy()];
  }
}
const enR = (f, [a,b]) => f && f >= a && f <= b;
function reporte(){
  const R = rango();
  const facts = S.facturas.filter(f => !f.anulada && enR(f.fecha, R));
  const anuladas = S.facturas.filter(f => f.anulada && enR(f.fecha, R)).length;
  let facturado = 0, desc = 0, itbis = 0, pendiente = 0;
  const items = {}, clis = {}, serie = {};
  const largo = (new Date(R[1]) - new Date(R[0])) / 864e5 > 62;
  let pv = 0, pc = 0, pn = 0;
  facts.forEach(f => {
    const c = calc(f); facturado += c.total; desc += c.desc; itbis += c.itbis; pendiente += c.balance;
    const k = largo ? f.fecha.slice(0,7) : f.fecha; serie[k] = (serie[k]||0) + c.total;
    const cn = f.clienteNombre || 'Sin nombre'; clis[cn] = clis[cn] || {n:0, t:0}; clis[cn].n++; clis[cn].t += c.total;
    f.items.forEach(it => {
      const imp = num(it.cant)*num(it.precio); const key = it.desc;
      items[key] = items[key] || {q:0, t:0, inv: !!it.invId}; items[key].q += num(it.cant); items[key].t += imp;
      if (it.invId) { pv += imp; pc += num(it.cant)*num(it.costo); pn += num(it.cant); }
    });
  });
  const metodos = {}; let cobrado = 0;
  S.facturas.filter(f => !f.anulada).forEach(f => (f.pagos||[]).forEach(p => { if (enR(p.fecha, R)) { cobrado += num(p.monto); metodos[p.metodo||'Otro'] = (metodos[p.metodo||'Otro']||0) + num(p.monto); } }));
  const totalDeben = S.facturas.filter(f => !f.anulada).reduce((a,f) => a + calc(f).balance, 0);
  return { R, facts, anuladas, facturado: r2(facturado), desc: r2(desc), itbis: r2(itbis), pendiente: r2(pendiente), cobrado: r2(cobrado), metodos, totalDeben: r2(totalDeben),
    items: Object.entries(items).sort((a,b) => b[1].t - a[1].t), clis: Object.entries(clis).sort((a,b) => b[1].t - a[1].t),
    serie, largo, prod: { venta: r2(pv), costo: r2(pc), n: pn, ganancia: r2(pv - pc) } };
}
function serieCompleta(r){
  const out = []; const [a,b] = r.R;
  if (r.largo) { let d = new Date(a.slice(0,7)+'-01T12:00:00'); const fin = b.slice(0,7);
    while (isoD(d).slice(0,7) <= fin && out.length < 36) { const k = isoD(d).slice(0,7); out.push([k, r.serie[k]||0, d.toLocaleDateString('es-DO',{month:'short'})]); d.setMonth(d.getMonth()+1); } }
  else { let d = new Date(a+'T12:00:00'); while (isoD(d) <= b && out.length < 62) { const k = isoD(d); out.push([k, r.serie[k]||0, String(d.getDate())]); d.setDate(d.getDate()+1); } }
  return out;
}

const fmtQ = n => { const v = r2(num(n)); return v.toLocaleString('es-DO', {maximumFractionDigits:2}); };
function plural(u, n){ u = u || 'unidad'; if (Math.abs(num(n)) === 1) return u; if (u === 'mechón') return 'mechones'; if (/[aeiouó]$/.test(u)) return u + 's'; return u + 'es'; }
function invNombre(p){ return [p.nombre, p.color, p.largo ? p.largo + '"' : ''].filter(Boolean).join(' '); }
const bajos = () => S.inventario.filter(p => num(p.cantidad) <= 0 || (num(p.minimo) > 0 && num(p.cantidad) <= num(p.minimo))).sort((a,b)=>num(a.cantidad)-num(b.cantidad));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const STOP = new Set('hay tengo tienes tiene tenemos queda quedan quedo me nos de del la el los las un una unos unas que cuanto cuantos cuantas cuanta en almacen algun alguna alguno producto productos y con para pulgadas pulgada pulg color inventario mi mis todavia aun si o por favor dime ver busca buscar existe existencia stock disponible disponibles'.split(' '));
function buscarInv(q){
  const words = norm(q).replace(/[¿?¡!.,;:"']/g,' ').split(/\s+/).filter(w => w && !STOP.has(w));
  if (!words.length) return { todo: true, words };
  const hay = p => norm([p.nombre, p.categoria, p.color, p.largo, p.largo ? p.largo+'in' : '', p.unidad].join(' '));
  const match = (h, w) => h.includes(w) || (w.length > 3 && w.endsWith('es') && h.includes(w.slice(0,-2))) || (w.length > 2 && w.endsWith('s') && h.includes(w.slice(0,-1)));
  const scored = S.inventario.map(p => { const h = hay(p); return { p, n: words.filter(w => match(h, w)).length }; });
  const exact = scored.filter(x => x.n === words.length).map(x => x.p);
  if (exact.length) return { exact: true, items: exact, words };
  const parcial = scored.filter(x => x.n > 0).sort((a,b) => b.n - a.n).map(x => x.p);
  return { exact: false, items: parcial, words };
}

    (S.readOnly?'':'<div class="row" style="margin-top:14px">'+(id?'<button class="btn d" data-act="invdel" data-id="'+id+'">Borrar</button>':'')+'<span class="grow"></span><button class="btn" data-act="cerrar">Cancelar</button><button class="btn p" data-act="invguardar" data-id="'+(id||'')+'">Guardar</button></div>'));
}
function conMov(p, delta, nota){
  const np = JSON.parse(JSON.stringify(p));
  np.cantidad = r2(num(np.cantidad) + delta);
  np.movs = (np.movs||[]).concat([{fecha: hoy(), delta: r2(delta), nota}]).slice(-40);
  return np;
}
const invBusy = {};
async function ajustarInv(id, delta, nota){
  if (invBusy[id]) return; const p = S.inventario.find(x=>x.id===id); if (!p) return;
  invBusy[id] = true; try { await guardar('inventario', conMov(p, delta, nota)); } catch(e){} finally { invBusy[id] = false; }
}
// factor -1 = vender (descontar), +1 = devolver. Devuelve el nombre de lo que no alcanzó (o '')
async function moverStock(f, factor){
  const porId = {};
  (f.items||[]).forEach(it => { if (it.invId) porId[it.invId] = (porId[it.invId]||0) + num(it.cant); });
  let falta = '';
  for (const id of Object.keys(porId)) {
    const p = S.inventario.find(x=>x.id===id); if (!p) continue;
    if (factor < 0 && num(p.cantidad) < porId[id]) falta = invNombre(p);
    try { await guardar('inventario', conMov(p, factor * porId[id], (factor<0?'Venta ':'Devuelto ')+numFmt(f))); } catch(e){}
  }
  return falta;
}

const RKEY = 'facturacion_pelo_ultimo_respaldo';
function ultimoRespaldo(){ try { return localStorage.getItem(RKEY) || ''; } catch(e){ return ''; } }
function necesitaRespaldo(){
  if (!S.facturas.length && !S.inventario.length && !S.clientes.length) return false;
  const u = ultimoRespaldo(); if (!u) return true;
  return (Date.now() - new Date(u+'T12:00:00').getTime()) > 7*864e5;
}

async function crearFactura(){
  const d = S.draft;
  const items = d.items.filter(it => String(it.desc).trim() || num(it.precio)).map(it => { const o = {desc: String(it.desc).trim() || 'Servicio', cant: num(it.cant) || 1, precio: r2(num(it.precio))}; if (it.invId) { o.invId = it.invId; o.costo = r2(num(it.costo)); } return o; });
  if (!items.length) return toast('Agrega al menos un servicio');
  let cli = null;
  if (d.clienteId === '__nuevo') {
    if (!d.nNombre.trim()) return toast('Escribe el nombre de la clienta');
    cli = { id: uid(), nombre: d.nNombre.trim(), telefono: d.nTel.trim(), notas: '', creado: hoy(), proxima: d.proxima || '' };
  } else if (d.clienteId) cli = cliente(d.clienteId);
  else return toast('Elige una clienta');
  const numero = proximoNumero();
  const f = { id: uid(), numero, prefijo: S.negocio.prefijo || 'IHC-', fecha: d.fecha || hoy(),
    clienteId: cli.id, clienteNombre: cli.nombre, clienteTel: cli.telefono || '',
    items, descuento: r2(num(d.descuento)), itbis: !!d.itbis, tasa: num(S.negocio.tasa) || 6.625,
    pagos: [], nota: d.nota.trim(), proxima: d.proxima || '', anulada: false, stock: items.some(it => it.invId), creada: new Date().toISOString() };
  const tot = calc(f).total;
  if (num(d.abono) > 0) f.pagos.push({ fecha: f.fecha, monto: r2(Math.min(num(d.abono), tot)), metodo: d.metodo });
  try {
    if (d.clienteId === '__nuevo') await guardar('clientes', cli);
    else if (d.proxima && d.proxima !== cli.proxima) await guardar('clientes', {...cli, proxima: d.proxima});
    await guardar('facturas', f);
    await guardarNegocio({...S.negocio, siguiente: numero + 1});
  } catch(e){ return; }
  const falta = await moverStock(f, -1);
  S.draft = null; S.facturaId = f.id; S.view = 'ver'; render(); window.scrollTo(0,0);
  toast(falta ? 'Guardada. Ojo: no había suficiente de '+falta : 'Factura '+numFmt(f)+' guardada');
}

function onField(e){
  const el = e.target; const k = el.dataset && el.dataset.f; if (!k) return;
  if (k === 'q') { S.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-f="q"]'); n.focus(); try{ n.setSelectionRange(pos,pos);}catch(_){} return; }
  if (k === 'qc') { S.qc = el.value; const pos = el.selectionStart; render(); const n = $('[data-f="qc"]'); n.focus(); try{ n.setSelectionRange(pos,pos);}catch(_){} return; }
  if (k === 'pregunta') { S.pregunta = el.value; return; }
  if (k === 'proxima' && S.draft) { S.draft.proxima = el.value; return; }
  const d = S.draft; if (!d) return;
  if (k === 'item') {
    const it = d.items[+el.dataset.i]; it[el.dataset.k] = el.value;
    const lt = $('#lt'+el.dataset.i); if (lt) lt.textContent = money(num(it.cant)*num(it.precio));
  } else if (k === 'itbis') d.itbis = el.checked;
  else if (k === 'clienteId') { d.clienteId = el.value; render(); return; }
  else if (k === 'addser') {
    if (e.type !== 'change' || !el.value) return;
    if (el.value === '__libre') d.items.push({desc:'', cant:1, precio:''});
    else if (el.value.startsWith('inv:')) { const p = S.inventario.find(x => x.id === el.value.slice(4)); if (p) d.items.push({desc: invNombre(p), cant: 1, precio: p.precio || '', invId: p.id, costo: num(p.costo)}); }
    else { const s = S.servicios.find(x => x.id === el.value); if (s) d.items.push({desc: s.nombre, cant: 1, precio: s.precio}); }
    render(); return;
  }
  else d[k] = el.value;
  const t = $('#tot'); if (t) t.innerHTML = totHtml();
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('fotoIn') && e.target.files.length) { nuevasFotos(e.target.files, e.target.dataset.cid, e.target.dataset.fid); e.target.value = ''; } });
document.addEventListener('input', e => { if (e.target.id === 'msgTxt') { const c = cliente(e.target.dataset.cid); const w = $('#msgWa'); if (c && w) w.href = waUrl(c.telefono, e.target.value); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'r_d' || id === 'r_h') { S.rDesde = ($('#r_d')||{}).value || ''; S.rHasta = ($('#r_h')||{}).value || ''; render(); }
  if (id === 'qrFile' && e.target.files[0]) cargarQr(e.target.files[0]);
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'restaurar' || !e.target.files[0]) return;
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (d.app !== 'facturacion-pelo') throw 0;
    confirmar('Restaurar copia', 'Se reemplazarán los datos actuales por los de la copia del '+fFecha((d.fecha||'').slice(0,10))+' ('+(d.facturas||[]).length+' facturas, '+(d.inventario||[]).length+' productos, '+(d.fotos||[]).length+' fotos).', 'Restaurar', async () => {
      if (Array.isArray(d.fotos)) { try { await Fotos.reemplazar(d.fotos); } catch(err){} S.fotos = {}; }
      S.negocio = migrarNeg(d.negocio); S.clientes = d.clientes||[]; S.servicios = d.servicios||[]; S.facturas = d.facturas||[]; S.inventario = d.inventario||[];
      localPersist(); render(); toast('Datos restaurados');
    });
  } catch(err){ toast('Ese archivo no es una copia válida'); }
  e.target.value = '';
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'preg') { e.preventDefault(); S.pregunta = e.target.value; const r = $('#resp'); if (r) r.innerHTML = respuestaHtml(); } });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.f; if (k === 'addser' || k === 'clienteId' || k === 'itbis') onField(e); });

init();
</script>
</body>
</html>
